name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version custom_components/post_at/manifest.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${version}"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
